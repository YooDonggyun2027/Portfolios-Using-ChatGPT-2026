<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나에게 딱 맞는 자기계발 유형 테스트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: #fff8f1;
      color: #4b4453;
    }
    .container { width: min(92%, 720px); margin: 0 auto; padding: 40px 0 70px; }
    .card {
      background: white; border-radius: 28px; padding: 38px;
      box-shadow: 0 12px 35px rgba(110, 80, 60, 0.10);
    }
    .emoji { font-size: 55px; text-align: center; margin-bottom: 10px; }
    h1 { text-align: center; color: #594a66; font-size: 30px; margin: 8px 0; }
    .subtitle { text-align: center; color: #8c7b8f; line-height: 1.7; margin-bottom: 30px; }
    .start-btn, .next-btn, .restart-btn {
      display: block; width: 100%; border: none; border-radius: 18px;
      padding: 16px; font-size: 17px; font-weight: bold; cursor: pointer;
      background: #9b8afb; color: white; transition: 0.2s;
    }
    button:hover { transform: translateY(-2px); opacity: 0.92; }
    .progress-area { margin-bottom: 25px; }
    .progress-text { display: flex; justify-content: space-between; font-size: 14px; color: #988b9e; margin-bottom: 8px; }
    .progress-bar { height: 10px; background: #eee8f1; border-radius: 20px; overflow: hidden; }
    .progress { height: 100%; width: 0%; background: #9b8afb; transition: width 0.3s; }
    .question { font-size: 23px; font-weight: bold; line-height: 1.5; margin-bottom: 22px; color: #55465e; }
    .answers { display: flex; flex-direction: column; gap: 12px; }
    .answer {
      border: 2px solid #eee7f0; background: #fff; border-radius: 16px;
      padding: 16px; text-align: left; cursor: pointer; font-size: 15px;
      color: #5c5261; transition: 0.2s;
    }
    .answer:hover { border-color: #b9aaff; background: #faf8ff; }
    .answer.selected { border-color: #9b8afb; background: #f1edff; font-weight: bold; }
    .next-btn { margin-top: 22px; }
    .hidden { display: none; }
    .result-icon { text-align: center; font-size: 75px; margin-bottom: 5px; }
    .result-type { text-align: center; color: #8c78df; font-size: 27px; font-weight: bold; margin: 8px 0; }
    .result-title { text-align: center; font-size: 20px; color: #63556c; margin-bottom: 25px; }
    .result-box { background: #faf7ff; border-radius: 20px; padding: 22px; margin-top: 18px; line-height: 1.8; }
    .result-box h3 { margin-top: 0; color: #725fd0; }
    .tip { background: #fff5e8; border-radius: 18px; padding: 18px; margin-top: 15px; line-height: 1.7; }
    .restart-btn { margin-top: 25px; background: #f29bb5; }
    .small-note { text-align: center; font-size: 13px; color: #aaa0aa; margin-top: 20px; }
  </style>
</head>
<body>
<div class="container">
  <div id="startScreen" class="card">
    <div class="emoji">🌷</div>
    <h1>나에게 딱 맞는<br>자기계발 유형 테스트</h1>
    <p class="subtitle">
      취업을 준비하면서<br>
      "나는 뭘 더 준비해야 하지?" 고민하고 있다면?<br><br>
      5개의 질문에 솔직하게 답하고<br>
      나에게 잘 맞는 자기계발 방법을 찾아보세요! ✨
    </p>
    <button class="start-btn" onclick="startTest()">테스트 시작하기 💜</button>
    <div class="small-note">약 2분 정도 소요됩니다.</div>
  </div>

  <div id="quizScreen" class="card hidden">
    <div class="progress-area">
      <div class="progress-text">
        <span id="questionNumber">질문 1 / 5</span>
        <span id="progressPercent">20%</span>
      </div>
      <div class="progress-bar"><div class="progress" id="progress"></div></div>
    </div>
    <div id="questionText" class="question"></div>
    <div id="answers" class="answers"></div>
    <button id="nextButton" class="next-btn" onclick="nextQuestion()">다음 질문 →</button>
  </div>

  <div id="resultScreen" class="card hidden">
    <div id="resultIcon" class="result-icon"></div>
    <div id="resultType" class="result-type"></div>
    <div id="resultTitle" class="result-title"></div>
    <div class="result-box">
      <h3>💡 이런 이유로 추천해요</h3>
      <p id="resultReason"></p>
    </div>
    <div class="result-box">
      <h3>🚀 추천 자기계발 방법</h3>
      <p id="resultDescription"></p>
    </div>
    <div class="tip">
      <strong>✨ 오늘부터 해볼 작은 행동</strong>
      <p id="resultTip"></p>
    </div>
    <button class="restart-btn" onclick="restartTest()">다시 테스트하기 🔄</button>
  </div>
</div>

<script>
const questions = [
  {
    question: "취업 준비를 하면서 가장 먼저 하고 싶은 것은?",
    answers: [
      { text: "전공이나 직무 관련 지식을 더 깊게 공부한다.", type: "A" },
      { text: "면접이나 발표 연습을 많이 해본다.", type: "B" },
      { text: "실제로 결과물을 하나 만들어 본다.", type: "C" },
      { text: "매일 공부할 수 있는 계획부터 세운다.", type: "D" },
      { text: "새로운 분야를 찾아보며 가능성을 넓힌다.", type: "E" }
    ]
  },
  {
    question: "새로운 능력을 배울 때 나는 어떤 방식이 가장 편할까?",
    answers: [
      { text: "책이나 강의를 통해 체계적으로 배우는 편이다.", type: "A" },
      { text: "사람들과 이야기하고 피드백을 받으며 배운다.", type: "B" },
      { text: "직접 해보면서 시행착오를 겪는 것이 좋다.", type: "C" },
      { text: "조금씩이라도 매일 반복하는 것이 좋다.", type: "D" },
      { text: "여러 분야를 조금씩 경험하며 흥미를 찾는다.", type: "E" }
    ]
  },
  {
    question: "취업 준비가 잘 풀리지 않을 때 나는?",
    answers: [
      { text: "부족한 지식을 찾아 공부한다.", type: "A" },
      { text: "주변 사람에게 조언이나 피드백을 구한다.", type: "B" },
      { text: "실제로 지원하거나 프로젝트를 시작해 본다.", type: "C" },
      { text: "생활 패턴과 계획을 다시 정리한다.", type: "D" },
      { text: "아예 다른 직무나 분야도 탐색해 본다.", type: "E" }
    ]
  },
  {
    question: "내가 생각하는 '성장했다'의 기준은?",
    answers: [
      { text: "전문 지식과 실력이 확실히 늘었다.", type: "A" },
      { text: "사람들에게 내 생각을 잘 전달할 수 있게 됐다.", type: "B" },
      { text: "남에게 보여줄 수 있는 결과물을 만들었다.", type: "C" },
      { text: "꾸준히 실천하는 습관이 생겼다.", type: "D" },
      { text: "새로운 관심사와 가능성을 발견했다.", type: "E" }
    ]
  },
  {
    question: "앞으로 한 달 동안 딱 하나만 할 수 있다면?",
    answers: [
      { text: "직무 관련 자격증이나 전문 교육을 끝낸다.", type: "A" },
      { text: "면접·발표·네트워킹 능력을 집중적으로 키운다.", type: "B" },
      { text: "포트폴리오에 넣을 프로젝트 하나를 완성한다.", type: "C" },
      { text: "매일 실천할 수 있는 자기계발 루틴을 만든다.", type: "D" },
      { text: "새로운 분야를 여러 개 체험해 본다.", type: "E" }
    ]
  }
];

const results = {
  A: {
    icon: "📚",
    type: "전문성 집중형",
    title: "깊이 있는 실력을 무기로 만드는 사람",
    reason: "당신은 새로운 것을 배울 때 체계적으로 이해하고 전문성을 쌓는 것을 중요하게 생각하는 편이에요. 취업 준비에서도 '내가 무엇을 얼마나 잘 아는가'를 확실하게 만드는 전략이 잘 맞습니다.",
    description: "직무 관련 자격증, 전문 교육, 전공 심화 공부처럼 하나의 분야를 깊게 파고드는 자기계발을 추천해요. 특히 대학원에서 쌓은 연구 경험을 직무 역량과 연결해 정리해 보면 강점이 될 수 있습니다.",
    tip: "관심 직무의 핵심 역량 3가지를 정하고, 이번 주에는 그중 하나를 집중적으로 공부해 보세요."
  },
  B: {
    icon: "🗣️",
    type: "소통 성장형",
    title: "사람과의 상호작용 속에서 성장하는 사람",
    reason: "당신은 혼자 공부하는 것보다 다른 사람과 대화하고 피드백을 주고받으면서 자신의 능력을 발전시키는 성향이 강해요.",
    description: "면접 스터디, 발표 연습, 네트워킹, 모의면접 등을 적극적으로 활용해 보세요. 특히 대학원에서 했던 연구나 프로젝트를 '누구나 이해할 수 있는 언어'로 설명하는 연습이 큰 도움이 됩니다.",
    tip: "오늘 3분 동안 '내 연구 경험이 지원 직무에 어떤 도움이 되는가?'를 소리 내어 설명해 보세요."
  },
  C: {
    icon: "💻",
    type: "실전 프로젝트형",
    title: "직접 만들어 보면서 성장하는 사람",
    reason: "당신은 이론을 오래 공부하기보다 직접 행동하고 결과물을 만들어 보면서 배우는 스타일이에요. 취업에서도 실제 경험과 결과물이 강력한 무기가 될 수 있습니다.",
    description: "포트폴리오, 개인 프로젝트, 공모전, 사이드 프로젝트 등 '완성된 결과물'을 만드는 자기계발을 추천해요. 작은 프로젝트라도 문제 → 과정 → 결과를 기록해 두면 자기소개서와 면접에서도 활용할 수 있습니다.",
    tip: "오늘 바로 시작할 수 있는 작은 프로젝트 하나를 정하고, 7일 안에 첫 번째 결과물을 만들어 보세요."
  },
  D: {
    icon: "🌱",
    type: "루틴 성장형",
    title: "작은 습관을 꾸준히 쌓는 사람",
    reason: "당신에게 가장 중요한 것은 한 번에 많은 것을 하는 것보다 꾸준히 실행할 수 있는 환경을 만드는 것이에요.",
    description: "공부 시간 관리, 아침 루틴, 운동, 독서, 영어 공부 등 매일 반복할 수 있는 작은 습관을 만들어 보세요. 거창한 계획보다 '매일 30분'처럼 실천 가능한 목표가 잘 맞습니다.",
    tip: "오늘부터 7일 동안 매일 30분씩 같은 시간에 취업 준비를 해보세요."
  },
  E: {
    icon: "🎨",
    type: "탐색·창의형",
    title: "새로운 가능성을 찾아가는 사람",
    reason: "당신은 한 가지 길에만 집중하기보다 여러 분야를 탐색하면서 자신의 관심과 가능성을 발견하는 성향이 있어요.",
    description: "새로운 직무 탐색, 온라인 강의, 콘텐츠 제작, 사이드 프로젝트, 다양한 사람들과의 대화 등을 추천합니다. 대학원에서 쌓은 전문성을 다른 분야와 연결해 보는 것도 좋은 전략이에요.",
    tip: "이번 주에 평소 관심 없었던 직무나 분야 하나를 골라 30분만 탐색해 보세요."
  }
};

let currentQuestion = 0;
let selectedType = null;
let scores = { A: 0, B: 0, C: 0, D: 0, E: 0 };

function startTest() {
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");
  showQuestion();
}

function showQuestion() {
  const q = questions[currentQuestion];
  document.getElementById("questionNumber").textContent = `질문 ${currentQuestion + 1} / ${questions.length}`;
  const percent = Math.round(((currentQuestion + 1) / questions.length) * 100);
  document.getElementById("progressPercent").textContent = `${percent}%`;
  document.getElementById("progress").style.width = `${percent}%`;
  document.getElementById("questionText").textContent = q.question;

  const answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";
  selectedType = null;

  q.answers.forEach(answer => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = answer.text;
    button.onclick = function() {
      document.querySelectorAll(".answer").forEach(btn => btn.classList.remove("selected"));
      button.classList.add("selected");
      selectedType = answer.type;
    };
    answersDiv.appendChild(button);
  });

  document.getElementById("nextButton").textContent =
    currentQuestion === questions.length - 1 ? "결과 확인하기 ✨" : "다음 질문 →";
}

function nextQuestion() {
  if (!selectedType) {
    alert("답변 하나를 골라주세요! 🌷");
    return;
  }
  scores[selectedType]++;
  currentQuestion++;
  if (currentQuestion < questions.length) showQuestion();
  else showResult();
}

function showResult() {
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");

  let winner = "A";
  Object.keys(scores).forEach(type => {
    if (scores[type] > scores[winner]) winner = type;
  });

  const result = results[winner];
  document.getElementById("resultIcon").textContent = result.icon;
  document.getElementById("resultType").textContent = result.type;
  document.getElementById("resultTitle").textContent = result.title;
  document.getElementById("resultReason").textContent = result.reason;
  document.getElementById("resultDescription").textContent = result.description;
  document.getElementById("resultTip").textContent = result.tip;
}

function restartTest() {
  currentQuestion = 0;
  selectedType = null;
  scores = { A: 0, B: 0, C: 0, D: 0, E: 0 };
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
}
</script>
</body>
</html>
