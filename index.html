<body>
  <main class="wrap">
    <header class="hero"><div class="eyebrow">Asia trip personality test</div><h1>나에게 딱 맞는<br>아시아 여행지는?</h1><p>7개의 순간 선택으로 찾는, 지금 떠나고 싶은 도시</p><div class="travel-line" aria-hidden="true">✈︎　⌁　☀︎　⌁　⌂</div></header>

  <script>
    const destinations={
      vietnam:{flag:'🇻🇳',name:'베트남',title:'가볍게 스며드는 로컬 힐링러',tag:'오토바이 소리와 진한 커피 사이, 낯선 일상에 가장 빨리 녹아드는 당신.',reason:'부담 없이 활기찬 거리와 맛있는 한 끼를 즐기며, 내 리듬대로 여행하고 싶은 성향이에요. 도시와 자연, 가성비와 감성이 균형을 이루는 베트남이 잘 맞습니다.',moments:['호이안 등불 아래의 느긋한 산책','현지 카페에서 마시는 코코넛 커피','오토바이로 만나는 다낭의 바닷바람']},

    const questions=[

    ];
    let step=0, scores={}; const ids=['A','B','C','D','E','F','G'];
    const $=s=>document.querySelector(s); function showQuestion(){const [q,opts]=questions[step];$('#count').textContent=`QUESTION ${step+1} / 7`;$('#percent').textContent=`${Math.round((step+1)/7*100)}%`;$('#bar').style.width=`${(step+1)/7*100}%`;$('#qno').textContent=`Q${step+1}.`;$('#question').textContent=q;$('#options').innerHTML='';opts.forEach(([key,text],i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${ids[i]}</b><span>${text}</span>`;b.onclick=()=>choose(key);$('#options').appendChild(b)})}function choose(key){scores[key]=(scores[key]||0)+3;step++;if(step<questions.length)showQuestion();else showResult()}function showResult(){let best=Object.keys(destinations).sort((a,b)=>(scores[b]||0)-(scores[a]||0)||a.localeCompare(b))[0];let d=destinations[best];$('#quiz').style.display='none';$('#flag').textContent=d.flag;$('#resultTitle').textContent=`${d.name} · ${d.title}`;$('#tagline').textContent=d.tag;$('#reason').textContent=d.reason;$('#moments').innerHTML=d.moments.map(x=>`<li>${x}</li>`).join('');$('#result').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}$('#start').onclick=()=>{scores={};step=0;$('#intro').style.display='none';$('#quiz').style.display='block';showQuestion()};$('#restart').onclick=()=>{$('#result').style.display='none';$('#intro').style.display='block';window.scrollTo({top:0,behavior:'smooth'})};
  </script>
</body>
